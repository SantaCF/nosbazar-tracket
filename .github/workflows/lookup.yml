name: Cerca item per nome
on:
  push:
    branches: [lookup]
  workflow_dispatch:
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          while IFS= read -r q; do
            [ -z "$q" ] && continue
            echo "== $q"
            curl -sS -G "https://nosbazar.com/api/items/name-search" --data-urlencode "q=$q" --data-urlencode "lang=IT"; echo
            sleep 1
          done <<'LIST'
          luna piena
          sgombro
          Sgombro
          pozione
          perla arcobaleno
          Perla
          fiore di ghiaccio
          Fiore
          LIST
