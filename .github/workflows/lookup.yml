name: Cerca item per nome
on:
  push:
    branches: [lookup]
  workflow_dispatch:
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && time python3 scripts/collect.py > out.txt && grep -c annunci out.txt && zcat data/listings/*/*.csv.gz | wc -l
