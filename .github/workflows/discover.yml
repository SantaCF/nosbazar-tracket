name: Scoperta API nosbazar
on:
  push:
    branches: [discovery]
    paths: ['scripts/discover.js', '.github/workflows/discover.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm install playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/discover.js
      - name: Salva i risultati nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add discovery
          git commit -m "Risultati scoperta API" || echo "niente da salvare"
          git push
