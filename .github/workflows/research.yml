name: Ricerca dati nosapki
on:
  push:
    branches: [research]
    paths: ['scripts/research.js', '.github/workflows/research.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm init -y >/dev/null && npm install playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/research.js
      - name: Salva i risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add research
          git commit -q -m "Risultati ricerca nosapki" || exit 0
          git push -q origin HEAD:research
