name: Raccolta prezzi bazar
on:
  schedule:
    - cron: '7,37 * * * *'   # ogni 30 minuti (evita il minuto 0, il più congestionato)
  workflow_dispatch:
  push:
    branches: [collector]
    paths: ['scripts/collect.py', '.github/workflows/collect.yml', 'config/items.txt']
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect.py
        env:
          NOS_SERVER: '1'   # 1 = EU-Dragonveil
      - name: Salva i dati nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "Prezzi $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
