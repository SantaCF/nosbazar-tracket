name: Raccolta prezzi bazar
on:
  schedule:
    - cron: '7,37 * * * *'   # ogni 30 minuti (evita il minuto 0, il più congestionato)
  workflow_dispatch:
  push:
    branches: [collector]
    paths: ['scripts/collect.py', '.github/workflows/collect.yml', 'config/items.txt']
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre l'ultima versione, non quella del momento in cui il giro è stato richiesto
      - name: Ricostruisce prices.csv se manca o ha un formato vecchio
        run: head -1 data/prices.csv 2>/dev/null | grep -q lot_price || python3 scripts/backfill_prices.py
      - run: python3 scripts/collect.py
        env:
          NOS_SERVER: '1'   # 1 = EU-Dragonveil
      - name: Stima vendite tra questo giro e il precedente
        run: python3 scripts/sales.py || echo "stima vendite non riuscita"
        env:
          NOS_SELLERS: ${{ vars.NOS_SELLERS || secrets.NOS_SELLERS }}   # i tuoi personaggi contano come un solo venditore
      - name: Venduti per fascia oraria
        run: python3 scripts/flow.py || echo "fasce orarie non riuscite"
      - name: Prezzo di vendita realistico
        run: python3 scripts/sell.py || echo "prezzo di vendita non riuscito"
      - name: Recupera lo stato delle notifiche
        uses: actions/cache/restore@v4
        with:
          path: .alerts
          key: alerts-${{ github.run_id }}
          restore-keys: alerts-
      - name: Notifiche sui tuoi annunci (ntfy)
        run: python3 scripts/alerts.py || echo "notifiche non riuscite"
        env:
          NOS_SELLERS: ${{ vars.NOS_SELLERS || secrets.NOS_SELLERS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_HOURS: ${{ vars.ALERT_HOURS }}
      - name: Salva lo stato delle notifiche
        if: hashFiles('.alerts/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .alerts
          key: alerts-${{ github.run_id }}
      - name: Avviso se la raccolta è rimasta ferma
        run: python3 scripts/watchdog.py --gap || true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Salva i dati nel repo
        # Se nel frattempo main è cambiato, riparte dall'ultima versione e riaggiunge solo i dati di
        # questo giro, così nessun giro va perso. Se non ci riesce, il job fallisce (e si vede).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/run
          git ls-files --others --exclude-standard data/listings > /tmp/run/new_files
          git diff --no-color -U0 data/prices.csv | grep '^+[^+]' | cut -c2- > /tmp/run/prices.csv || true
          git diff --no-color -U0 data/summary.csv | grep '^+[^+]' | cut -c2- > /tmp/run/summary.csv || true
          # sales.csv ricostruito da capo (formato nuovo): si salva intero, non si accoda.
          # Ricostruito anche quando cambiano le regole di conteggio (data/sales_rules.txt).
          if [ "$(git show HEAD:data/sales.csv | head -1)" != "$(head -1 data/sales.csv)" ] || [ "$(git show HEAD:data/sales_rules.txt 2>/dev/null)" != "$(cat data/sales_rules.txt 2>/dev/null)" ]; then
            cp data/sales.csv /tmp/run/sales_full.csv; : > /tmp/run/sales.csv
          else
            git diff --no-color -U0 data/sales.csv | grep '^+[^+]' | cut -c2- > /tmp/run/sales.csv || true
          fi
          # Vendite per venditore, un file al giorno: i file nuovi si copiano, quelli esistenti si accodano.
          mkdir -p /tmp/run/owners
          for f in data/owners/*.csv; do
            [ -e "$f" ] || continue
            if [ -e /tmp/run/sales_full.csv ] || ! git cat-file -e HEAD:"$f" 2>/dev/null; then
              echo "$f" >> /tmp/run/new_files
            else
              git diff --no-color -U0 "$f" | grep '^+[^+]' | cut -c2- > /tmp/run/owners/$(basename "$f") || true
            fi
          done
          git diff --no-color -U0 data/sell.csv | grep '^+[^+]' | cut -c2- > /tmp/run/sell.csv || true
          tar -cf /tmp/run/files.tar data/items_resolved.json data/latest.csv $( [ -e data/flow.csv ] && echo data/flow.csv ) $( [ -e data/sales_rules.txt ] && echo data/sales_rules.txt ) $(cat /tmp/run/new_files)
          [ -s /tmp/run/new_files ] || { echo "Nessun dato nuovo"; exit 0; }
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            tar -xf /tmp/run/files.tar
            cat /tmp/run/prices.csv >> data/prices.csv
            cat /tmp/run/summary.csv >> data/summary.csv
            if [ -e /tmp/run/sales_full.csv ]; then cp /tmp/run/sales_full.csv data/sales.csv; else cat /tmp/run/sales.csv >> data/sales.csv; fi
            for f in /tmp/run/owners/*.csv; do [ -e "$f" ] && cat "$f" >> data/owners/$(basename "$f"); done
            cat /tmp/run/sell.csv >> data/sell.csv
            git add data
            git commit -q -m "Prezzi $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then echo "Salvato al tentativo $i"; exit 0; fi
            sleep $((i * 5))
          done
          echo "Impossibile salvare i dati dopo 5 tentativi"; exit 1
      - name: Avviso se il giro non è riuscito
        if: failure()
        run: python3 scripts/watchdog.py --failed || true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
